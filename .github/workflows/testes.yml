# Roda os testes a cada envio para o GitHub e em cada pull request.
# Ghostscript, Tesseract e Office não são instalados aqui: os testes que dependem deles são pulados.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # A menor versão aceita e a usada no desenvolvimento
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Rodar os testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
